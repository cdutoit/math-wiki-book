# Builds the PDF and website with `make site` and publishes build/web to
# GitHub Pages. Pull requests build only, so a broken chapter fails the check
# without touching the live site.
name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live and LaTeXML
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-pictures texlive-fonts-recommended \
            latexml

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build PDF and website
        run: make site

      - name: Keep the PDF with the run
        uses: actions/upload-artifact@v4
        with:
          name: book-pdf
          path: build/pdf/main.pdf

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
